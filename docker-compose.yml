version: '3.8'

services:
  adapter-bank:
    build: .
    container_name: ${BANK_ID:-adapter}_bank
    ports:
      - "${ADAPTER_PORT:-3005}:${ADAPTER_PORT:-3005}"
    environment:
      ADAPTER_PORT: ${ADAPTER_PORT:-3005}
      BANK_NAME: ${BANK_NAME:-Adapter Bank}
      BANK_CORE_URL: ${BANK_CORE_URL:-http://host.docker.internal:8081}
      HUB_CALLBACK_URL: ${HUB_CALLBACK_URL:-http://host.docker.internal:3000/consents/callback}
      SESSION_SECRET: ${SESSION_SECRET:-adapter-session-secret-key-change-in-prod}
    env_file:
      - .env
