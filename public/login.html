<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Bank</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        h2 { color: #005A9C; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #005A9C; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #004080; }
        .error { color: red; font-size: 0.9rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Bank Login</h2>
        <p style="font-size: 0.9rem; color: #666;">Connecting via Open Banking</p>
        
        <div id="error-msg" class="error"></div>
        
        <form action="/login" method="POST">
            <input type="hidden" name="consentId" id="consentId">
            <input type="hidden" name="redirect_uri" id="redirectUri">
            <input type="hidden" name="permissions" id="permissions">
            
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Sign In</button>
        </form>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('consentId').value = params.get('consentId') || '';
        document.getElementById('redirectUri').value = params.get('redirect_uri') || '';
        document.getElementById('permissions').value = params.get('permissions') || '';
        
        if (params.get('error')) {
            document.getElementById('error-msg').innerText = params.get('error');
        }
    </script>
</body>
</html>
