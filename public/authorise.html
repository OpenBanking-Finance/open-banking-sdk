<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorizar Acesso - Instituição Financeira</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #005A9C; margin-bottom: 1rem; }
        .details { background: #eef2f5; padding: 10px; border-radius: 4px; margin-bottom: 1.5rem; text-align: left; font-size: 0.9rem; color: #444; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-bottom: 10px; }
        button:hover { background-color: #218838; }
        .btn-cancel { background-color: #dc3545; }
        .btn-cancel:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2>Autorização de Acesso</h2>
        <p>Um aplicativo terceiro (Fintech) está solicitando acesso aos seus dados bancários.</p>
        
        <div class="details">
            <strong>Permissões solicitadas:</strong>
            <ul>
                <li>Leitura de saldo das contas</li>
                <li>Leitura de histórico de transações</li>
            </ul>
        </div>
        
        <form action="/consents/authorise" method="POST" id="authForm">
            <input type="hidden" name="consentId" id="consentId">
            <input type="hidden" name="redirect_uri" id="redirectUri">
            
            <button type="submit">Aprovar Acesso</button>
        </form>
        
        <button class="btn-cancel" onclick="cancel()">Negar Acesso</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('consentId').value = params.get('consentId') || '';
        document.getElementById('redirectUri').value = params.get('redirect_uri') || '';

        function cancel() {
            const redirectUri = params.get('redirect_uri') || 'http://127.0.0.1:3000/consents/callback';
            const consentId = params.get('consentId') || '';
            // Return to hub with REJECTED status
            window.location.href = `${redirectUri}?consentId=${consentId}&status=REJECTED`;
        }
    </script>
</body>
</html>
